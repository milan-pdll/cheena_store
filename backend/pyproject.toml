[project]
name = "football-store-backend"
version = "0.1.0"
description = "FastAPI database-free backend for football boots and jersey store catalogue"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "aiofiles",
    "PyJWT[crypto]",
    "bcrypt",
    "cloudinary",
    "python-multipart"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
